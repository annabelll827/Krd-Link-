<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagros AI - Modern Auth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Modern Card with Purple Accent Border */
        .auth-container {
            width: 380px;
            padding: 40px 28px;
            background: #ffffff;
            border-radius: 28px;
            border: 1.5px solid #818cf8;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08);
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .auth-container h2 {
            font-size: 2.2em;
            margin-bottom: 28px;
            text-align: center;
            color: #4f46e5;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88em;
            color: #0f172a;
            font-weight: 700;
        }

        /* Input Wrappers with Icons */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            color: #4f46e5;
            font-size: 1.05em;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background-color: #f1f5f9;
            border: 1px solid transparent;
            outline: none;
            border-radius: 14px;
            color: #0f172a;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: #4f46e5;
            cursor: pointer;
            font-size: 1.05em;
        }

        .options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
            font-size: 0.85em;
        }

        .options a {
            color: #4f46e5;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* Vibrant Gradient Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #94a3b8;
            font-size: 0.75em;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span { padding: 0 12px; }

        .btn-google {
            width: 100%;
            padding: 13px;
            background-color: #ffffff;
            border: 1.5px solid #818cf8;
            border-radius: 14px;
            color: #0f172a;
            font-size: 0.95em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-google:hover {
            background-color: #f8fafc;
        }

        .btn-google svg { width: 18px; height: 18px; }

        .switch-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88em;
            color: #64748b;
        }

        .switch-link a {
            color: #4f46e5;
            text-decoration: none;
            cursor: pointer;
            font-weight: 700;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .step-box { display: none; }
        .step-box.active { display: block; }

        /* Main App Interface Style */
        .zagros-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #ffffff !important;
            position: relative;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        /* Purple Brand Text without Logo Icon */
        .brand-logo {
            display: flex;
            align-items: center;
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #4f46e5;
        }

        /* Welcome Text Styling */
        .welcome-title {
            font-size: 2.2em;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            text-align: center;
            margin-top: auto;
            margin-bottom: 24px;
        }

        .welcome-title span {
            color: #4f46e5;
        }

        .prompt-box {
            width: 100%;
            max-width: 500px;
            background: #f1f5f9;
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: auto;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #000000;
            font-size: 1.05em;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .prompt-input::placeholder {
            color: #94a3b8;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #4f46e5;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.15s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .auth-container { width: 92%; padding: 30px 20px; }
            .welcome-title { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-section">
        <!-- Log In Form -->
        <div class="form-box active" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
                    </div>
                </div>

                <div class="options">
                    <a onclick="showForm('forgot')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Log In</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openZagrosPage('User')">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Don't have an account? <a onclick="showForm('signup')">Sign Up</a>
                </div>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div class="form-box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('signup-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openZagrosPage('User')">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Already have an account? <a onclick="showForm('login')">Log In</a>
                </div>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-box" id="forgot-box">
            <h2>Reset Password</h2>
            
            <form id="passwords-step" class="step-box active">
                <div class="input-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="new-pass" placeholder="Enter new password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirm-pass" placeholder="Confirm new password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Send Code</button>
            </form>

            <form id="code-step" class="step-box">
                <div class="input-group">
                    <label>Verification Code</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="text" maxlength="6" placeholder="Enter 6-digit code" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Change Password</button>
            </form>

            <div class="switch-link">
                Remember your password? <a onclick="showForm('login')">Log In</a>
            </div>
        </div>
    </div>

    <!-- Zagros AI Main Section -->
    <div class="zagros-container" id="zagros-section">
        <div class="top-nav">
            <div class="brand-logo">
                Zagros AI
            </div>
        </div>

        <!-- Dynamic Welcome Heading -->
        <h1 class="welcome-title">Welcome, <span id="user-display-name">User</span></h1>

        <div class="prompt-box">
            <input type="text" class="prompt-input" placeholder="Ask Zagros">
            <div class="prompt-actions">
                <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                <button class="action-btn"><i class="fa-solid fa-microphone"></i></button>
            </div>
        </div>
    </div>

    <script>
        function showForm(formType) {
            document.getElementById('passwords-step').classList.add('active');
            document.getElementById('code-step').classList.remove('active');

            document.getElementById('signup-box').classList.remove('active');
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('forgot-box').classList.remove('active');

            if (formType === 'login') document.getElementById('login-box').classList.add('active');
            else if (formType === 'signup') document.getElementById('signup-box').classList.add('active');
            else if (formType === 'forgot') document.getElementById('forgot-box').classList.add('active');
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function openZagrosPage(name) {
            document.getElementById('user-display-name').textContent = name || 'User';
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('zagros-section').style.display = 'flex';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value;
            const extractedName = emailInput.split('@')[0];
            openZagrosPage(extractedName);
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-name').value;
            openZagrosPage(fullName);
        });

        document.getElementById('passwords-step').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            document.getElementById('passwords-step').classList.remove('active');
            document.getElementById('code-step').classList.add('active');
        });

        document.getElementById('code-step').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Password updated successfully!");
            showForm('login');
        });
    </script>

</body>
</html>
