<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovable Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f1015;
            color: #fff;
            transition: background 0.3s ease;
        }

        body.logged-in {
            background: #ffffff;
            color: #0f172a;
        }

        /* Auth Container Styles */
        .auth-container {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .auth-container h2 {
            font-size: 2em;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #d1d5db;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
        }

        .options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .options a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .options a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 0.85em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .divider span { padding: 0 10px; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-google:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-google svg { width: 18px; height: 18px; }

        .switch-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .step-box { display: none; }
        .step-box.active { display: block; }

        /* Lovable Light Theme Styles */
        .lovable-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        /* Top Header Navigation */
        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            z-index: 2;
        }

        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-size: 1.1em;
            cursor: pointer;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        .logo-heart {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ff4b4b, #ff758c);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 75%, 18% 100%, 0% 38%);
            transform: rotate(-10deg);
        }

        /* Badge Pill */
        .connect-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 6px 16px 6px 8px;
            border-radius: 30px;
            font-size: 0.88em;
            font-weight: 500;
            color: #334155;
            margin-bottom: 30px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            z-index: 2;
        }

        .icon-stack {
            display: flex;
            align-items: center;
        }

        .icon-stack img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin-right: -6px;
            border: 2px solid #ffffff;
        }

        /* Main Heading */
        .hero-title {
            font-size: 2.1em;
            font-weight: 700;
            text-align: center;
            line-height: 1.25;
            margin-bottom: 35px;
            max-width: 320px;
            color: #0f172a;
            z-index: 2;
        }

        /* Input Box */
        .prompt-box {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 18px 20px 14px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
            z-index: 2;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #0f172a;
            font-size: 1.05em;
            margin-bottom: 25px;
        }

        .prompt-input::placeholder {
            color: #94a3b8;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .build-dropdown {
            font-size: 0.9em;
            font-weight: 500;
            color: #334155;
        }

        /* App Store Card */
        .app-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            z-index: 2;
        }

        .app-card-text {
            font-size: 0.9em;
            font-weight: 600;
            color: #1e293b;
            padding-left: 8px;
        }

        .app-store-btn {
            background: #0f172a;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
        }

        .app-store-btn i {
            font-size: 1.4em;
        }

        .app-store-text {
            display: flex;
            flex-direction: column;
            text-align: left;
            line-height: 1.1;
        }

        .app-store-text span:first-child {
            font-size: 0.55em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .app-store-text span:last-child {
            font-size: 0.85em;
            font-weight: 700;
        }

        /* Light Bottom Glow Background */
        .glow-bg {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 380px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.6) 0%, rgba(192, 132, 252, 0.5) 35%, rgba(244, 114, 182, 0.5) 70%, rgba(251, 113, 133, 0.6) 100%);
            filter: blur(70px);
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            pointer-events: none;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .auth-container { width: 90%; padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-section">
        <!-- Log In Form -->
        <div class="form-box active" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <a onclick="showForm('forgot')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Log In</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openLovablePage()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Don't have an account? <a onclick="showForm('signup')">Sign Up</a>
                </div>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div class="form-box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openLovablePage()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Already have an account? <a onclick="showForm('login')">Log In</a>
                </div>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-box" id="forgot-box">
            <h2>Reset Password</h2>
            
            <form id="passwords-step" class="step-box active">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="new-pass" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-pass" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn-submit">Send Code</button>
            </form>

            <form id="code-step" class="step-box">
                <div class="input-group">
                    <label>Verification Code</label>
                    <input type="text" maxlength="6" placeholder="Enter 6-digit code" required>
                </div>

                <button type="submit" class="btn-submit">Change Password</button>
            </form>

            <div class="switch-link">
                Remember your password? <a onclick="showForm('login')">Log In</a>
            </div>
        </div>
    </div>

    <!-- Lovable White Page Section -->
    <div class="lovable-container" id="lovable-section">
        <div class="top-nav">
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="brand-logo">
                <div class="logo-heart"></div>
                Lovable
            </div>
            <div style="width: 44px;"></div>
        </div>

        <div class="connect-badge">
            <div class="icon-stack">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="gmail">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Slack_icon_2019.svg" alt="slack">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Google_Maps_icon_%282020%29.svg" alt="maps">
            </div>
            Connect all your tools &rarr;
        </div>

        <h1 class="hero-title">Let's build something, hoshmand</h1>

        <div class="prompt-box">
            <input type="text" class="prompt-input" placeholder="Create a presentation about...">
            <div class="prompt-actions">
                <div class="left-actions">
                    <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="right-actions">
                    <button class="action-btn build-dropdown">Build <i class="fa-solid fa-chevron-down" style="font-size: 0.7em; margin-left: 2px;"></i></button>
                    <button class="action-btn"><i class="fa-solid fa-microphone"></i></button>
                </div>
            </div>
        </div>

        <div class="app-card">
            <span class="app-card-text">Your best ideas. On the go.</span>
            <a href="#" class="app-store-btn">
                <i class="fa-brands fa-apple"></i>
                <div class="app-store-text">
                    <span>Download on the</span>
                    <span>App Store</span>
                </div>
            </a>
        </div>

        <div class="glow-bg"></div>
    </div>

    <script>
        function showForm(formType) {
            document.getElementById('passwords-step').classList.add('active');
            document.getElementById('code-step').classList.remove('active');

            document.getElementById('signup-box').classList.remove('active');
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('forgot-box').classList.remove('active');

            if (formType === 'login') document.getElementById('login-box').classList.add('active');
            else if (formType === 'signup') document.getElementById('signup-box').classList.add('active');
            else if (formType === 'forgot') document.getElementById('forgot-box').classList.add('active');
        }

        function openLovablePage() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('lovable-section').style.display = 'flex';
            document.body.classList.add('logged-in');
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openLovablePage();
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openLovablePage();
        });

        // Forgot Password Logic
        document.getElementById('passwords-step').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            document.getElementById('passwords-step').classList.remove('active');
            document.getElementById('code-step').classList.add('active');
        });

        document.getElementById('code-step').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Password updated successfully!");
            showForm('login');
        });
    </script>

</body>
</html>
