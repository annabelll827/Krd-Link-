<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovable Design - White Theme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            color: #0f172a;
            transition: background 0.3s ease;
        }

        /* Auth Styles */
        .auth-container {
            width: 400px;
            padding: 40px;
            background: #f8fafc;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .auth-container h2 {
            font-size: 2em;
            margin-bottom: 25px;
            text-align: center;
            color: #0f172a;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #475569;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            outline: none;
            border-radius: 10px;
            color: #0f172a;
            font-size: 1em;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9em;
            color: #64748b;
        }

        .switch-link a {
            color: #2563eb;
            text-decoration: none;
            cursor: pointer;
        }

        /* Lovable Light Theme Styles */
        .lovable-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        /* Top Header Navigation */
        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            z-index: 2;
        }

        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-size: 1.1em;
            cursor: pointer;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        .logo-heart {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ff4b4b, #ff758c);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 75%, 18% 100%, 0% 38%);
            transform: rotate(-10deg);
        }

        /* Badge Pill */
        .connect-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 6px 16px 6px 8px;
            border-radius: 30px;
            font-size: 0.88em;
            font-weight: 500;
            color: #334155;
            margin-bottom: 30px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            z-index: 2;
        }

        .icon-stack {
            display: flex;
            align-items: center;
        }

        .icon-stack img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin-right: -6px;
            border: 2px solid #ffffff;
        }

        /* Main Heading */
        .hero-title {
            font-size: 2.1em;
            font-weight: 700;
            text-align: center;
            line-height: 1.25;
            margin-bottom: 35px;
            max-width: 320px;
            color: #0f172a;
            z-index: 2;
        }

        /* Input Box */
        .prompt-box {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 18px 20px 14px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
            z-index: 2;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #0f172a;
            font-size: 1.05em;
            margin-bottom: 25px;
        }

        .prompt-input::placeholder {
            color: #94a3b8;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .build-dropdown {
            font-size: 0.9em;
            font-weight: 500;
            color: #334155;
        }

        /* App Store Card */
        .app-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            z-index: 2;
        }

        .app-card-text {
            font-size: 0.9em;
            font-weight: 600;
            color: #1e293b;
            padding-left: 8px;
        }

        .app-store-btn {
            background: #0f172a;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
        }

        .app-store-btn i {
            font-size: 1.4em;
        }

        .app-store-text {
            display: flex;
            flex-direction: column;
            text-align: left;
            line-height: 1.1;
        }

        .app-store-text span:first-child {
            font-size: 0.55em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .app-store-text span:last-child {
            font-size: 0.85em;
            font-weight: 700;
        }

        /* Light Bottom Glow Background */
        .glow-bg {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 380px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.6) 0%, rgba(192, 132, 252, 0.5) 35%, rgba(244, 114, 182, 0.5) 70%, rgba(251, 113, 133, 0.6) 100%);
            filter: blur(70px);
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            pointer-events: none;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .auth-container { width: 90%; padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-section">
        <div class="form-box active" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-submit">Log In</button>
                <div class="switch-link">
                    Don't have an account? <a onclick="showForm('signup')">Sign Up</a>
                </div>
            </form>
        </div>

        <div class="form-box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn-submit">Sign Up</button>
                <div class="switch-link">
                    Already have an account? <a onclick="showForm('login')">Log In</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Lovable White Page Section -->
    <div class="lovable-container" id="lovable-section">
        <div class="top-nav">
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="brand-logo">
                <div class="logo-heart"></div>
                Lovable
            </div>
            <div style="width: 44px;"></div>
        </div>

        <div class="connect-badge">
            <div class="icon-stack">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="gmail">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Slack_icon_2019.svg" alt="slack">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Google_Maps_icon_%282020%29.svg" alt="maps">
            </div>
            Connect all your tools &rarr;
        </div>

        <h1 class="hero-title">Let's build something, hoshmand</h1>

        <div class="prompt-box">
            <input type="text" class="prompt-input" placeholder="Create a presentation about...">
            <div class="prompt-actions">
                <div class="left-actions">
                    <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="right-actions">
                    <button class="action-btn build-dropdown">Build <i class="fa-solid fa-chevron-down" style="font-size: 0.7em; margin-left: 2px;"></i></button>
                    <button class="action-btn"><i class="fa-solid fa-microphone"></i></button>
                </div>
            </div>
        </div>

        <div class="app-card">
            <span class="app-card-text">Your best ideas. On the go.</span>
            <a href="#" class="app-store-btn">
                <i class="fa-brands fa-apple"></i>
                <div class="app-store-text">
                    <span>Download on the</span>
                    <span>App Store</span>
                </div>
            </a>
        </div>

        <div class="glow-bg"></div>
    </div>

    <script>
        function showForm(formType) {
            document.getElementById('signup-box').classList.remove('active');
            document.getElementById('login-box').classList.remove('active');

            if (formType === 'login') document.getElementById('login-box').classList.add('active');
            else if (formType === 'signup') document.getElementById('signup-box').classList.add('active');
        }

        function openLovablePage() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('lovable-section').style.display = 'flex';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openLovablePage();
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openLovablePage();
        });
    </script>

</body>
</html>
