<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth & AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #fff;
        }

        /* Authentication Styles */
        .auth-container {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .auth-container h2 {
            font-size: 2em;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #d1d5db;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            transition: 0.3s ease;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .options a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .options a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(29, 78, 216, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 0.85em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .divider span { padding: 0 10px; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-google:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-google svg { width: 18px; height: 18px; }

        .switch-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-link a:hover { text-decoration: underline; }

        .step-box { display: none; }
        .step-box.active { display: block; }

        /* AI Chat Container Styles */
        .chat-container {
            display: none;
            width: 90%;
            max-width: 850px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 1.3em;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover { background: rgba(239, 68, 68, 0.4); }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .message.bot {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #38bdf8;
        }

        .btn-send {
            padding: 0 25px;
            background: #38bdf8;
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover { background: #0284c7; color: #fff; }

        @media (max-width: 480px) {
            .auth-container { width: 90%; padding: 25px; }
            .chat-container { width: 95%; height: 90vh; }
        }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-section">
        <!-- Sign Up Form -->
        <div class="form-box active" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="loginWithGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Already have an account? <a onclick="showForm('login')">Log In</a>
                </div>
            </form>
        </div>

        <!-- Log In Form -->
        <div class="form-box" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <a onclick="showForm('forgot')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Log In</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="loginWithGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Don't have an account? <a onclick="showForm('signup')">Sign Up</a>
                </div>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-box" id="forgot-box">
            <h2>Reset Password</h2>
            
            <form id="passwords-step" class="step-box active">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="new-pass" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-pass" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn-submit">Send Code</button>
            </form>

            <form id="code-step" class="step-box">
                <div class="input-group">
                    <label>Verification Code</label>
                    <input type="text" maxlength="6" placeholder="Enter 6-digit code" required>
                </div>

                <button type="submit" class="btn-submit">Change Password</button>
            </form>

            <div class="switch-link">
                Remember your password? <a onclick="showForm('login')">Log In</a>
            </div>
        </div>
    </div>

    <!-- AI Chat Interface Section -->
    <div class="chat-container" id="chat-section">
        <div class="chat-header">
            <h3>✦ AI Assistant</h3>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>

        <div class="chat-box" id="chat-messages">
            <div class="message bot">
                سڵاو! بەخێرپێیت بۆ AI Chat. چۆن دەتوانم یارمه‌تیت بدم؟
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="پەیامەکەت بنووسە..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function showForm(formType) {
            const signupBox = document.getElementById('signup-box');
            const loginBox = document.getElementById('login-box');
            const forgotBox = document.getElementById('forgot-box');

            document.getElementById('passwords-step').classList.add('active');
            document.getElementById('code-step').classList.remove('active');

            signupBox.classList.remove('active');
            loginBox.classList.remove('active');
            forgotBox.classList.remove('active');

            if (formType === 'login') loginBox.classList.add('active');
            else if (formType === 'signup') signupBox.classList.add('active');
            else if (formType === 'forgot') forgotBox.classList.add('active');
        }

        // Redirect to AI Chat View
        function openChat() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('chat-section').style.display = 'flex';
        }

        function logout() {
            document.getElementById('chat-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
            showForm('login');
        }

        // Form Submit Actions
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openChat();
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openChat();
        });

        function loginWithGoogle() {
            openChat();
        }

        // Forgot Password Logic
        document.getElementById('passwords-step').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            document.getElementById('passwords-step').classList.remove('active');
            document.getElementById('code-step').classList.add('active');
        });

        document.getElementById('code-step').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Password updated successfully!");
            showForm('login');
        });

        // Chat UI System
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();

            if (messageText === "") return;

            const chatMessages = document.getElementById('chat-messages');

            // Append User Message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = messageText;
            chatMessages.appendChild(userMsg);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Simulated AI Response
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = "پەیامەکەت گەیشت! دەتوانیت لێرەوە Gemini API یان هەر APIیەکی تر ببەستیتەوە.";
                chatMessages.appendChild(botMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
