<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagros AI - White Background</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Pure White Background for the Page Behind Login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff !important;
            color: #ffffff;
        }

        /* Dark Login Card Container */
        .auth-container {
            width: 360px;
            padding: 32px 24px;
            background-color: #23252a;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .auth-container h2 {
            font-size: 2em;
            margin-bottom: 24px;
            text-align: center;
            color: #ffffff;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88em;
            color: #e4e4e7;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000;
            border: 1px solid #3f3f46;
            outline: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95em;
        }

        .input-group input::placeholder {
            color: #71717a;
        }

        .options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .options a {
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 1.5px solid #ffffff;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #18181b;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: #a1a1aa;
            font-size: 0.75em;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #3f3f46;
        }

        .divider span { padding: 0 10px; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: #1c1d22;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-google svg { width: 18px; height: 18px; }

        .switch-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.88em;
            color: #a1a1aa;
        }

        .switch-link a {
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 700;
        }

        .step-box { display: none; }
        .step-box.active { display: block; }

        /* Main App Interface Style */
        .zagros-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #ffffff !important;
            position: relative;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .logo-heart {
            width: 22px;
            height: 22px;
            background: #000000;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 75%, 18% 100%, 0% 38%);
            transform: rotate(-10deg);
        }

        .prompt-box {
            width: 100%;
            max-width: 500px;
            background: #23252a;
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: auto 0;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.05em;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .prompt-input::placeholder {
            color: #71717a;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.15s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .auth-container { width: 90%; padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-section">
        <!-- Log In Form -->
        <div class="form-box active" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <a onclick="showForm('forgot')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Log In</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openZagrosPage()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Don't have an account? <a onclick="showForm('signup')">Sign Up</a>
                </div>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div class="form-box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="btn-google" onclick="openZagrosPage()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.5s.7 4.8 1.9 7.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="switch-link">
                    Already have an account? <a onclick="showForm('login')">Log In</a>
                </div>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div class="form-box" id="forgot-box">
            <h2>Reset Password</h2>
            
            <form id="passwords-step" class="step-box active">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="new-pass" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-pass" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn-submit">Send Code</button>
            </form>

            <form id="code-step" class="step-box">
                <div class="input-group">
                    <label>Verification Code</label>
                    <input type="text" maxlength="6" placeholder="Enter 6-digit code" required>
                </div>

                <button type="submit" class="btn-submit">Change Password</button>
            </form>

            <div class="switch-link">
                Remember your password? <a onclick="showForm('login')">Log In</a>
            </div>
        </div>
    </div>

    <!-- Zagros AI Main Section -->
    <div class="zagros-container" id="zagros-section">
        <div class="top-nav">
            <div class="brand-logo">
                <div class="logo-heart"></div>
                Zagros AI
            </div>
        </div>

        <div class="prompt-box">
            <input type="text" class="prompt-input" placeholder="Ask Zagros">
            <div class="prompt-actions">
                <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                <button class="action-btn"><i class="fa-solid fa-microphone"></i></button>
            </div>
        </div>
    </div>

    <script>
        function showForm(formType) {
            document.getElementById('passwords-step').classList.add('active');
            document.getElementById('code-step').classList.remove('active');

            document.getElementById('signup-box').classList.remove('active');
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('forgot-box').classList.remove('active');

            if (formType === 'login') document.getElementById('login-box').classList.add('active');
            else if (formType === 'signup') document.getElementById('signup-box').classList.add('active');
            else if (formType === 'forgot') document.getElementById('forgot-box').classList.add('active');
        }

        function openZagrosPage() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('zagros-section').style.display = 'flex';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openZagrosPage();
        });

        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            openZagrosPage();
        });

        document.getElementById('passwords-step').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            document.getElementById('passwords-step').classList.remove('active');
            document.getElementById('code-step').classList.add('active');
        });

        document.getElementById('code-step').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Password updated successfully!");
            showForm('login');
        });
    </script>

</body>
</html>
